<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario ( Talentos + Marketing )</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --celeste:#008EAA; --celeste-cl:#00C1D4; --celeste-os:#00728A; --azul:#006EC1; --gris:#97999B;
  --violeta:#6E3FA3; --fucsia:#E63888; --naranja:#FF6A14; --verde:#6CC24A; --rojo:#E10600;
  --tinta:#22262E; --tinta2:#5A6068; --papel:#F1F5F8; --linea:#E1E6ED; --linea2:#EDF1F5;
  --tal-bg:#FCE4EF; --mkt-bg:#E7F6DD; --int-bg:#FFEADC; --fer-bg:#FDEAE8; --fer-tx:#C0170F;
  --r:12px; --sombra:0 1px 2px rgba(34,38,46,.05), 0 6px 20px rgba(34,38,46,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--papel);color:var(--tinta);font-size:14px;line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1300px;margin:0 auto;padding:0 24px}
.sp{flex:1}

/* ---------- BANDA DE MARCA ---------- */
.marca{background:var(--celeste);color:#fff}
.marca .wrap{display:flex;align-items:center;gap:16px;padding:13px 24px}
.marca img{height:30px;display:block}
.marca .div{width:1px;height:26px;background:rgba(255,255,255,.35)}
.marca .tit{font-size:15px;font-weight:500;letter-spacing:.1px}
.marca .sub{font-size:11px;letter-spacing:.5px;text-transform:uppercase;opacity:.8}
.btn-b{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 14px;font-weight:500}
.btn-b:hover{background:rgba(255,255,255,.22)}
.btn-b.solido{background:#fff;color:var(--celeste-os);border-color:#fff;font-weight:600}
.btn-b.solido:hover{background:#EAF7FA}

header{background:#fff;border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:40}
.btn{border:1px solid var(--linea);background:#fff;border-radius:10px;padding:9px 14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:#C9D2DC;background:#FBFCFD}
.btn.pri{background:var(--celeste);color:#fff;border-color:var(--celeste)}
.btn.pri:hover{background:var(--celeste-os);border-color:var(--celeste-os)}
.btn.dark{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.btn.mini{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tinta2)}
.btn.ghost:hover{background:var(--linea2)}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

.h2{display:flex;align-items:center;gap:16px;padding:13px 0 12px;flex-wrap:wrap}
.periodo{font-size:25px;font-weight:600;letter-spacing:-.5px;margin:0;min-width:215px;text-transform:capitalize;line-height:1.1}
.periodo span{color:var(--gris);font-weight:300}
.flechas{display:flex;gap:6px}
.flechas button{width:34px;height:34px;border-radius:9px;border:1px solid var(--linea);background:#fff;font-size:15px;color:var(--tinta2)}
.tabs{display:flex;background:var(--papel);border-radius:11px;padding:3px;gap:2px;border:1px solid var(--linea)}
.tabs button{border:0;background:transparent;padding:7px 15px;border-radius:9px;font-weight:500;color:var(--gris)}
.tabs button.on{background:#fff;color:var(--tinta);box-shadow:0 1px 4px rgba(34,38,46,.12)}
.h3{display:flex;align-items:center;gap:8px;padding:0 0 14px;flex-wrap:wrap}
.chip-f{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;color:var(--gris)}
.chip-f .dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.chip-f.on.tal{color:#fff;background:var(--fucsia);border-color:var(--fucsia)}
.chip-f.on.mkt{color:#fff;background:var(--verde);border-color:var(--verde)}
.chip-f.on.int{color:#fff;background:var(--naranja);border-color:var(--naranja)}
.chip-f.on.fer{color:#fff;background:var(--rojo);border-color:var(--rojo)}
.busca{position:relative}
.busca input{border:1px solid var(--linea);border-radius:10px;padding:9px 12px 9px 34px;width:210px;background:#fff}
.busca::before{content:"⌕";position:absolute;left:12px;top:8px;color:var(--gris);font-size:17px}
select.filtro{border:1px solid var(--linea);border-radius:10px;padding:9px 10px;background:#fff;max-width:155px;font-size:13px;color:var(--tinta2)}
.alerta{border:1px solid #F6C9B7;background:#FFF3ED;color:#B24A0E;border-radius:10px;padding:9px 13px;font-weight:600;font-size:13px}
.alerta.ok{border-color:var(--linea);background:#fff;color:var(--gris);font-weight:500}
.alerta.rojo{background:var(--rojo);border-color:var(--rojo);color:#fff;box-shadow:0 2px 10px rgba(225,6,0,.25)}

/* ---------- MES ---------- */
main{padding:20px 0 70px}
.grid-mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra)}
.dow{background:#fff;padding:10px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--gris);font-weight:600;text-align:center}
.dia{background:#fff;min-height:128px;padding:7px 7px 9px;cursor:pointer;transition:background .12s;position:relative;overflow:hidden;min-width:0}
.dia:hover{background:#F8FBFD}
.dia.otro{background:#FAFBFC;color:#B9C1CB}
.dia.finde{background:#FCFDFE}
.dia.feriado{background:var(--fer-bg)}
.dnum{display:flex;align-items:center;gap:6px;margin-bottom:5px;min-height:24px}
.num{font-size:12.5px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;flex:none}
.dia.otro .num{color:#C3C9D4;font-weight:400}
.dia.hoy .num{background:var(--azul);color:#fff}
.dia.feriado .num{color:var(--fer-tx)}
.fer-tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--fer-tx);font-weight:600}
.plus{opacity:0;border:0;background:var(--celeste);color:#fff;border-radius:7px;width:22px;height:22px;line-height:1;font-size:14px;margin-left:auto;flex:none}
.dia:hover .plus{opacity:1}
.ev{width:100%;text-align:left;border:0;border-left:3px solid;border-radius:6px;padding:4px 6px;margin-bottom:4px;font-size:11.5px;line-height:1.3;display:block;overflow:hidden}
.ev b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .hr{font-size:10px;color:var(--tinta2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.tal{background:var(--tal-bg);border-color:var(--fucsia)}
.ev.mkt{background:var(--mkt-bg);border-color:var(--verde)}
.ev.int{background:var(--int-bg);border-color:var(--naranja)}
.ev.conf{box-shadow:inset 0 0 0 1.5px #E8623C}
.ev.opc{border-left-style:dashed}
.tg{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.5px;padding:1px 4px;border-radius:4px;margin-right:5px}
.tg.tal{background:var(--fucsia);color:#fff}
.tg.mkt{background:var(--verde);color:#fff}
.tg.int{background:var(--naranja);color:#fff}
.tg.opc{background:#fff;color:var(--tinta2);border:1px solid var(--gris)}
.revisar{background:#FFF8E6;border:1px solid #F2DFA4;color:#8A6A0B;border-radius:11px;padding:12px 14px;font-size:12.8px;margin-bottom:14px}
.mas{font-size:10.5px;color:var(--gris);border:0;background:none;padding:2px 4px;font-weight:500}

.grid-sem{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.col-dia{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:9px;min-height:230px;overflow:hidden;min-width:0}
.col-dia.feriado{background:var(--fer-bg)}
.col-dia h4{margin:0 0 9px;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;text-transform:capitalize}
.dia-wrap{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
@media(max-width:980px){.dia-wrap{grid-template-columns:1fr}.grid-sem{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.grid-sem{grid-template-columns:1fr}.wrap{padding:0 14px}}
.card{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sombra)}
.card h3{margin:0 0 12px;font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--gris);font-weight:600}
.agenda-it{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--linea2);cursor:pointer}
.agenda-it:first-of-type{border-top:0}
.tit{font-weight:500}
.meta{font-size:12.5px;color:var(--tinta2);margin-top:3px}
.pill{display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;padding:3px 8px;border-radius:999px;vertical-align:middle}
.pill.tal{background:var(--tal-bg);color:#C1216A}
.pill.mkt{background:var(--mkt-bg);color:#3F7A22}
.pill.int{background:var(--int-bg);color:#B24A0E}
.pill.gris{background:var(--linea2);color:var(--tinta2)}
.sala-row{display:grid;grid-template-columns:104px 1fr;gap:9px;align-items:center;font-size:12px;margin-bottom:7px}
.sala-bar{height:26px;background:var(--papel);border-radius:7px;position:relative;overflow:hidden}
.sala-bloque{position:absolute;top:0;bottom:0;border-radius:6px;font-size:10px;color:#fff;padding:6px;white-space:nowrap;overflow:hidden}
.sala-bloque.tal{background:var(--fucsia)}.sala-bloque.mkt{background:var(--verde)}.sala-bloque.int{background:var(--naranja)}
.lista-mes{margin-bottom:22px}
.lista-mes h3{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--gris);margin:0 0 9px;font-weight:600}
.lista-it{background:#fff;border:1px solid var(--linea);border-left:4px solid;border-radius:10px;padding:12px 15px;margin-bottom:8px;display:flex;gap:16px;align-items:flex-start;cursor:pointer}
.lista-it.tal{border-left-color:var(--fucsia)}.lista-it.mkt{border-left-color:var(--verde)}.lista-it.int{border-left-color:var(--naranja)}
.lista-it .fecha{min-width:104px;font-weight:600;font-size:13px;text-transform:capitalize}
.vacio{text-align:center;color:var(--gris);padding:44px;background:#fff;border:1px dashed var(--linea);border-radius:var(--r)}

/* ---------- MODALES ---------- */
.overlay{position:fixed;inset:0;background:rgba(24,30,40,.5);display:none;z-index:60;padding:22px;overflow:auto;backdrop-filter:blur(2px)}
.overlay.on{display:block}
.modal{background:#fff;max-width:740px;margin:0 auto;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.3);overflow:hidden}
.modal.ancho{max-width:920px}
.mhead{padding:15px 22px;border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:12px;background:var(--celeste);color:#fff}
.mhead h2{margin:0;font-size:16.5px;font-weight:600}
.mhead.tal{background:var(--fucsia)} .mhead.mkt{background:var(--verde)} .mhead.int{background:var(--naranja)}
.mbody{padding:18px 22px;max-height:calc(100vh - 200px);overflow:auto;background:#FBFCFD}
.mfoot{padding:14px 22px;border-top:1px solid var(--linea);display:flex;gap:10px;align-items:center;background:#fff}
.cerrar{border:0;background:rgba(255,255,255,.2);width:32px;height:32px;border-radius:9px;font-size:16px;color:#fff}
/* bloques del formulario */
.bloque{background:#fff;border:1px solid var(--linea);border-radius:12px;margin-bottom:14px;overflow:hidden}
.bloque>h4{margin:0;padding:9px 15px;background:#EEF4F7;border-bottom:1px solid var(--linea);font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--celeste-os);font-weight:600;display:flex;align-items:center;gap:8px}
.bloque>h4 em{font-style:normal;color:var(--gris);font-weight:400;text-transform:none;letter-spacing:0;font-size:11.5px}
.bloque .in{padding:14px 15px}
.campo{margin-bottom:0}
.campo+.campo{margin-top:13px}
.campo>label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--gris);font-weight:600;margin-bottom:6px}
input[type=text],input[type=date],input[type=time],select,textarea{border:1px solid var(--linea);border-radius:10px;padding:10px 12px;background:#fff;width:100%}
textarea{min-height:70px;resize:vertical}
.grande{font-size:16px!important;font-weight:500}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.f2{grid-template-columns:1fr}}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.seg button{border:1px solid var(--linea);background:#fff;border-radius:10px;padding:9px 13px;font-weight:500;font-size:13px;color:var(--tinta2)}
.seg button.on{border-color:var(--celeste);background:var(--celeste);color:#fff}
.seg button.on[data-ar=talentos]{background:var(--fucsia);border-color:var(--fucsia);color:#fff}
.seg button.on[data-ar=marketing]{background:var(--verde);border-color:var(--verde);color:#fff}
.seg button.on[data-ar=interno]{background:var(--naranja);border-color:var(--naranja);color:#fff}
.seg button.on[data-area=interno]{background:var(--naranja);border-color:var(--naranja);color:#fff}
.tagarea{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tinta2);margin-top:10px}
.chks{display:flex;gap:8px;flex-wrap:wrap}
.chk{border:1px solid var(--linea);border-radius:10px;padding:8px 12px;display:inline-flex;align-items:center;gap:8px;font-size:13px;background:#fff;cursor:pointer}
.chk input{width:15px;height:15px;accent-color:var(--celeste)}
.chk.on{border-color:var(--celeste);background:var(--mkt-bg)}
.fila-fecha{display:grid;grid-template-columns:1fr 116px 116px auto 32px;gap:9px;align-items:center;margin-bottom:8px}
@media(max-width:640px){.fila-fecha{grid-template-columns:1fr 1fr}}
.quitar{border:0;background:var(--linea2);border-radius:9px;width:32px;height:32px;color:var(--tinta2)}
.aviso{border-radius:11px;padding:12px 14px;font-size:12.8px;margin-bottom:14px;line-height:1.5}
.aviso.rojo{background:#FFF1EC;border:1px solid #F6C5B2;color:#A63A0B}
.aviso.ok{background:#F2FAEE;border:1px solid #D2E9C4;color:#3E7A22}
.aviso.info{background:#EDF7FA;border:1px solid #C3E3EC;color:#0B6377}
.aviso b{font-weight:600}
.aviso ul{margin:7px 0 0;padding-left:18px}
.tag{display:inline-flex;align-items:center;gap:7px;background:var(--papel);border:1px solid var(--linea);border-radius:999px;padding:5px 7px 5px 12px;font-size:12.5px;margin:0 6px 6px 0}
.tag button{border:0;background:none;color:var(--gris);font-size:14px;line-height:1;padding:0 2px}
.hint{font-size:11.5px;color:var(--gris);margin-top:6px;line-height:1.45}

/* personas */
.pers-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:700px){.pers-tools{grid-template-columns:1fr 1fr}}
.pers-tools input,.pers-tools select{padding:8px 10px;border-radius:9px;font-size:13px}
.acciones{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.equipo-hit{background:#EDF7FA;border:1px solid #C3E3EC;border-radius:10px;padding:9px 12px;margin:10px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.equipo-hit b{font-weight:600}
.pers-list{max-height:250px;overflow:auto;border:1px solid var(--linea);border-radius:10px;margin-top:10px;padding:4px;background:#fff}
.pers-it{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:9px;cursor:pointer}
.pers-it:hover{background:var(--papel)}
.pers-it input{width:15px;height:15px;accent-color:var(--celeste);flex:none}
.pers-it .n{flex:1;font-size:13px}
.pers-it .g{font-size:11px;color:var(--gris);text-align:right;max-width:52%}
.sel-head{margin-top:10px;padding:10px 12px;background:#F4F8FA;border:1px solid var(--linea);border-radius:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sel-body{margin-top:8px;max-height:200px;overflow:auto;display:none;border:1px solid var(--linea);border-radius:10px;padding:10px 12px;background:#fff}
.sel-body.on{display:block}
.grupo-sel{font-size:12px;color:var(--tinta2);margin-bottom:8px}
details.desp{border:1px solid var(--linea);border-radius:10px;background:#fff;margin-top:10px}
details.desp>summary{padding:10px 13px;font-weight:500;cursor:pointer;font-size:13px;list-style:none;display:flex;align-items:center;gap:8px}
details.desp>summary::before{content:"▸";color:var(--celeste);font-size:13px}
details.desp[open]>summary::before{content:"▾"}
details.desp .in{padding:0 13px 13px}
table.tab{width:100%;border-collapse:collapse;font-size:12.8px}
table.tab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);padding:7px 8px;border-bottom:1px solid var(--linea)}
table.tab td{padding:9px 8px;border-bottom:1px solid var(--linea2);vertical-align:top}
.det-hero{padding:18px 22px;border-bottom:1px solid var(--linea)}
.det-hero h2{margin:6px 0 0;font-size:20px;font-weight:600;letter-spacing:-.3px}
.det-grid{display:grid;grid-template-columns:132px 1fr;gap:12px 16px;font-size:13.5px}
.det-grid dt{color:var(--gris);font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;padding-top:3px}
.det-grid dd{margin:0}
.fecha-it{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--linea2)}
.fecha-it:last-child{border-bottom:0}
.fecha-it b{font-weight:500;min-width:158px}
.diff{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.diff .kpi{border:1px solid var(--linea);border-radius:11px;padding:12px;background:#fff;text-align:center}
.diff .kpi b{display:block;font-size:22px;font-weight:600}
.diff .alta b{color:var(--verde)} .diff .baja b{color:var(--rojo)} .diff .cambio b{color:var(--naranja)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:12px 20px;border-radius:11px;font-size:13px;z-index:90;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
/* =======================================================================
   CALENDARIO TALENTOS + MARKETING · fyo
   Registro de cambios
   v1.0 · Migración del Excel (hoja 2026): 78 eventos + 16 feriados.
   v2.0 · Mes grande, click en el día, botón único "Nuevo", feriados en rojo,
          salas múltiples, nómina real con equipos, detalle con más contraste.
   v3.0 · Pedidos de Mica:
          - Banda superior en celeste fyo con el logo original.
          - Formulario por bloques con títulos resaltados.
          - Personas: buscador que entiende "equipo de <líder>", filtros
            escribibles (líder, unidad, vertical, sociedad y PUESTO),
            botón "Toda la compañía" y solapa desplegable "Pegar listado"
            (nombre y apellido o mail, tilda solo lo que encuentra).
          - Tipo "Institucional / compartido" (jornadas, etc.).
          - Se cierra el modal clickeando al costado.
          - Nómina: se sube el Excel actualizado y muestra los cambios
            contra la anterior (altas, bajas y cambios de líder/unidad/puesto).
          - Datos: descarga un Excel con formato de los eventos filtrados,
            con filtros automáticos y una hoja de participantes.
   v4.0 · Pedidos de Mica:
          - Colores de área más distintos + etiqueta TAL/MKT/INST en cada
            evento, y marca "OPC" para lo opcional.
          - Asistencia obligatoria u opcional por evento.
          - Sin negro en los botones seleccionados del alta.
          - Buscar un líder trae al líder Y a su equipo.
          - Pegar listado reescrito: lee fila por fila, entiende
            "Apellido, Nombre" y "Nombre Apellido", ignora encabezados,
            no repite y no inventa: si hay varias coincidencias te deja
            elegir y lista aparte lo que no encontró.
          - Panel "Fechas para revisar": eventos en sábado, domingo o
            feriado, con botón para moverlos al día hábil.
   v5.0 · Pedidos de Mica:
          - Talentos pasa a fucsia y Marketing a verde (paleta del manual),
            fuera las siglas TAL/MKT/INST de los eventos.
          - Si hay conflictos, arriba aparece "Hay conflictos" en rojo.
          - En la tabla de conflictos: "Ver el día" lleva a la vista de ese
            día y hay un botón para editar cada uno de los dos eventos.
          - Matías Locaso y Valeria Marinovich se suman como quienes

/* ---------------- carga / migración ---------------- */
function cargar(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ const d=JSON.parse(raw); d.eventos ||= []; d.feriados ||= []; d.nomina ||= NOMINA_BASE.slice(); return d; }
    const v2=localStorage.getItem(KEY_V2);
    if(v2){ const d=JSON.parse(v2); d.nomina=NOMINA_BASE.slice(); d.v=3; return d; }
    const v1=localStorage.getItem(KEY_V1);
    if(v1) return migrarV1(JSON.parse(v1));
  }catch(e){ console.warn('No se pudo leer lo guardado',e); }
  return semilla();
}
function migrarV1(v){
  const d=semilla();
  if(Array.isArray(v.eventos)&&v.eventos.length){
    d.eventos=v.eventos.map(e=>({id:e.id,titulo:e.titulo,area:e.area,
      tipo:e.area==='talentos'?'capacitacion':(e.area==='marketing'?'externo':'institucional'),
      responsable:e.responsable==='Ro'?'Rocío Bergero':(e.responsable||'Micaela Martínez'),
      modalidad:e.modalidad,salas:salasDe(e.sala),salaOtra:'',lugar:e.lugar||'',detalle:e.detalle||'',
      notas:e.notas||'',participantes:e.participantes||[],fechas:e.fechas||[]}));
    if(v.feriados) d.feriados=v.feriados;
  }
  return d;
}
function limpiarLugar(t){
  return (t||'').replace(/todo el d[ií]a\s*(\(viaje\))?/ig,m=>m.toLowerCase().includes('viaje')?'(viaje)':'')
    .replace(/\s*·\s*/g,' · ').replace(/^[\s·]+|[\s·]+$/g,'').trim();
}
function salasDe(s){ if(!s) return []; if(s==='Sala A + B') return ['Sala A','Sala B']; if(s==='Sala 8 (webinar)') return []; return [s]; }
function semilla(){
  const eventos=SEED.eventos.map((e,i)=>{
    const lug=e.sala==='Sala 8 (webinar)'?'Sala 8 (webinar)':(e.sala?'':(limpiarLugar(e.detalle)==='(viaje)'?'Fuera de la oficina (viaje)':limpiarLugar(e.detalle)));
    return {id:'x'+i+'_'+Math.random().toString(36).slice(2,6), titulo:e.titulo, area:e.area,
      tipo: e.area==='talentos'?'capacitacion':(e.area==='marketing'?'externo':'institucional'),
      responsable: e.area==='talentos'?'Micaela Martínez':(e.area==='interno'?'Micaela Brescacín':'Rocío Bergero'),
      modalidad: e.sala&&e.sala!=='Sala 8 (webinar)'?'oficina':((e.virtual||e.sala==='Sala 8 (webinar)')?'virtual':'fuera'),
      salas:salasDe(e.sala), salaOtra:'', lugar:lug, detalle:e.sala?(e.detalle||''):'', notas:'', obligatorio:true,
      participantes:[], fechas:e.fechas.map(f=>({f,d:e.desde||'',h:e.hasta||'',todo:!!e.todoElDia||!e.desde}))};
  });
  return {eventos, feriados:SEED.feriados.slice(), nomina:NOMINA_BASE.slice(), nominaFecha:'', v:3};
}

/* ---------------- utilidades ---------------- */
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function norm(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function deIso(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fechaLarga(s){ const d=deIso(s); return DOW[(d.getDay()+6)%7]+' '+d.getDate()+' '+MESES[d.getMonth()].slice(0,3); }
function fechaCompleta(s){ const d=deIso(s); return DOW[(d.getDay()+6)%7]+' '+d.getDate()+' de '+MESES[d.getMonth()]; }
function mins(h){ if(!h) return null; const [a,b]=h.split(':').map(Number); return a*60+(b||0); }
function uid(){ return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function esc(s){ return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2800); }
function feriadoDe(f){ return DB.feriados.find(x=>x.fecha===f); }
function persona(id){ return DB.nomina.find(p=>p.l===id); }
function nombreDe(id){ const p=persona(id); return p?p.n:id; }
function lugarDe(ev){
  const s=(ev.salas||[]).concat(ev.salaOtra?[ev.salaOtra]:[]);
  if(s.length) return s.join(' + ');
  if(ev.modalidad==='virtual') return ev.lugar||'Virtual';
  return ev.lugar||'';
}
function tipoTexto(k){ return (TIPOS.find(t=>t.k===k)||{t:'Otro'}).t; }
function areaDeResponsable(n){ const r=RESPONSABLES.find(x=>x.n===n); return r?r.area:'talentos'; }

/* ---------------- jerarquía ---------------- */
function armarJerarquia(){
  JER={porLegajo:{},directos:{},equipo:{},lideres:[]};
  DB.nomina.forEach(p=>JER.porLegajo[p.l]=p);
  const porSet={};
  DB.nomina.forEach(p=>{ const k=[...new Set(norm(p.n).split(/\s+/))].sort().join(' '); (porSet[k] ||= []).push(p); });
  const legajoDeNombre=nombre=>{
    const t=[...new Set(norm(nombre).split(/\s+/))].sort().join(' ');
    if(porSet[t]&&porSet[t].length===1) return porSet[t][0].l;
    const ts=new Set(norm(nombre).split(/\s+/));
    const c=DB.nomina.filter(p=>{ const ps=new Set(norm(p.n).split(/\s+/)); return [...ts].every(x=>ps.has(x))||[...ps].every(x=>ts.has(x)); });
    return c.length===1?c[0].l:null;
  };
  [...new Set(DB.nomina.map(p=>p.j).filter(Boolean))].forEach(nm=>{
    const dir=DB.nomina.filter(p=>p.j===nm).map(p=>p.l);
    JER.directos[nm]=dir;
    JER.lideres.push({nombre:nm,legajo:legajoDeNombre(nm),directos:dir.length});
  });
  const equipoDe=(nm,visto)=>{
    visto ||= new Set();
    if(visto.has(nm)) return [];
    visto.add(nm);
    let out=(JER.directos[nm]||[]).slice();
    (JER.directos[nm]||[]).forEach(lg=>{
      const p=JER.porLegajo[lg];
      if(p&&JER.directos[p.n]) out=out.concat(equipoDe(p.n,visto));
      const alias=JER.lideres.find(l=>l.legajo===lg);
      if(alias&&p&&alias.nombre!==p.n) out=out.concat(equipoDe(alias.nombre,visto));
    });
    return [...new Set(out)];
  };
  JER.lideres.forEach(l=>{ JER.equipo[l.nombre]=equipoDe(l.nombre); l.total=JER.equipo[l.nombre].length; });
  JER.lideres.sort((a,b)=>a.nombre.localeCompare(b.nombre));
}

/* ---------------- ocurrencias / filtros / conflictos ---------------- */
function ocurrencias(evs){
  const out=[];
  (evs||DB.eventos).forEach(ev=>(ev.fechas||[]).forEach((f,i)=>out.push({ev,fecha:f.f,d:f.d,h:f.h,todo:f.todo,idx:i})));
  return out;
}
function pasaFiltros(ev){
  if(!filtros.areas.has(ev.area)) return false;
  if(filtros.sala&&!(ev.salas||[]).includes(filtros.sala)) return false;
  if(filtros.resp&&ev.responsable!==filtros.resp) return false;
  if(filtros.persona&&!(ev.participantes||[]).includes(filtros.persona)) return false;
  if(filtros.q){
    const q=norm(filtros.q);
    const heno=norm([ev.titulo,ev.detalle,lugarDe(ev),ev.responsable,ev.notas,tipoTexto(ev.tipo)].join(' '));
    if(!heno.includes(q)&&!(ev.participantes||[]).some(id=>norm(nombreDe(id)).includes(q))) return false;
  }
  return true;
}
const ordenar=(a,b)=>a.fecha.localeCompare(b.fecha)||((mins(a.d)??-1)-(mins(b.d)??-1))||a.ev.titulo.localeCompare(b.ev.titulo);
function visibles(){ return ocurrencias().filter(o=>pasaFiltros(o.ev)).sort(ordenar); }
function seSolapan(a,b){
  if(a.fecha!==b.fecha) return false;
  if(a.todo||b.todo||!a.d||!b.d||!a.h||!b.h) return true;
  return mins(a.d)<mins(b.h)&&mins(b.d)<mins(a.h);
}
function conflictosDe(oc,uni){
  const otros=(uni||ocurrencias()).filter(o=>o.ev.id!==oc.ev.id), sala=[], gente=[];
  const mias=(oc.ev.salas||[]).filter(s=>SALAS_FISICAS.includes(s));
  otros.forEach(o=>{
    if(!seSolapan(oc,o)) return;
    const cs=mias.filter(s=>(o.ev.salas||[]).includes(s));
    if(cs.length) sala.push({oc:o,salas:cs});
    const cg=(oc.ev.participantes||[]).filter(p=>(o.ev.participantes||[]).includes(p));
    if(cg.length) gente.push({oc:o,personas:cg});
  });
  return {sala,gente};
}
function tieneConflicto(oc,uni){ const c=conflictosDe(oc,uni); return c.sala.length||c.gente.length; }
function todosLosConflictos(){
  const uni=ocurrencias(), vistos=new Set(), out=[];
  uni.forEach(oc=>{
    const c=conflictosDe(oc,uni);
    c.sala.forEach(s=>{ const k=[oc.ev.id,s.oc.ev.id].sort().join('|')+oc.fecha+'s'; if(!vistos.has(k)){vistos.add(k); out.push({tipo:'sala',a:oc,b:s.oc,salas:s.salas});} });
    c.gente.forEach(g=>{ const k=[oc.ev.id,g.oc.ev.id].sort().join('|')+oc.fecha+'g'; if(!vistos.has(k)){vistos.add(k); out.push({tipo:'gente',a:oc,b:g.oc,personas:g.personas});} });
  });
  return out.sort((x,y)=>x.a.fecha.localeCompare(y.a.fecha));
}

  document.getElementById('subt').textContent=cursor.getFullYear()+(DB.nominaFecha?' · nómina '+DB.nominaFecha:'');
  document.getElementById('vista').innerHTML = vista==='mes'?htmlMes():vista==='semana'?htmlSemana():vista==='dia'?htmlDia():htmlLista();
  const n=todosLosConflictos().length, r=revisiones().length, b=document.getElementById('btnConf');
  b.textContent=(n?'⚠ Hay conflictos ('+n+')':'✓ Sin conflictos')+(r?' · '+r+' a revisar':'');
  b.classList.toggle('ok',n===0&&r===0);
  b.classList.toggle('rojo',n>0);
  document.getElementById('periodo').innerHTML=etiqueta();
}
function etiqueta(){
  if(vista==='mes'||vista==='lista') return cap(MESES[cursor.getMonth()])+' <span>'+cursor.getFullYear()+'</span>';
  if(vista==='dia') return cap(fechaCompleta(iso(cursor)))+' <span>'+cursor.getFullYear()+'</span>';
  const l=lunesDe(cursor), d=new Date(l); d.setDate(d.getDate()+6);
  return l.getDate()+' '+MESES[l.getMonth()].slice(0,3)+' – '+d.getDate()+' '+MESES[d.getMonth()].slice(0,3)+' <span>'+cursor.getFullYear()+'</span>';
}
function lunesDe(d){ const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; }
const SIGLA={talentos:'TAL',marketing:'MKT',interno:'INST'};
function chipEv(o,uni){
  const conf=tieneConflicto(o,uni), lug=lugarDe(o.ev), cl=AREA_CLASE[o.ev.area];
  const opc=o.ev.obligatorio===false;
  return '<button class="ev '+cl+(conf?' conf':'')+(opc?' opc':'')+'" data-ev="'+o.ev.id+'">'+
    '<b>'+(conf?'⚠ ':'')+esc(o.ev.titulo)+'</b><span class="hr">'+
    (opc?'<i class="tg opc">opcional</i>':'')+
    (o.todo||!o.d?'Todo el día':esc(o.d)+(o.h?'–'+esc(o.h):''))+(lug?' · '+esc(lug):'')+'</span></button>';
}
function htmlMes(){
  const y=cursor.getFullYear(), m=cursor.getMonth(), ini=lunesDe(new Date(y,m,1));
  const ocs=visibles(), uni=ocurrencias(), porFecha={};
  ocs.forEach(o=>(porFecha[o.fecha] ||= []).push(o));
  let h='<div class="grid-mes">'+DOW.map(d=>'<div class="dow">'+d+'</div>').join('');
  const hoyIso=iso(new Date());
  for(let i=0;i<42;i++){
    const d=new Date(ini); d.setDate(d.getDate()+i);
    if(i%7===0&&i>0&&d.getMonth()!==m&&d>new Date(y,m,1)) break;
    const f=iso(d), fer=feriadoDe(f), lista=porFecha[f]||[];
    const cls=['dia']; if(d.getMonth()!==m)cls.push('otro'); if([0,6].includes(d.getDay()))cls.push('finde');
    if(fer&&filtros.areas.has('feriado'))cls.push('feriado'); if(f===hoyIso)cls.push('hoy');
    h+='<div class="'+cls.join(' ')+'" data-nuevofecha="'+f+'"><div class="dnum"><span class="num">'+d.getDate()+'</span>'+
      (fer&&filtros.areas.has('feriado')?'<span class="fer-tag">feriado</span>':'')+
      '<button class="plus" data-nuevofecha="'+f+'" title="Cargar acá">＋</button></div>';
    lista.slice(0,3).forEach(o=>h+=chipEv(o,uni));
    if(lista.length>3) h+='<button class="mas" data-dia="'+f+'">+'+(lista.length-3)+' más</button>';
    h+='</div>';
  }
  return h+'</div>';
}
function htmlSemana(){
  const l=lunesDe(cursor), ocs=visibles(), uni=ocurrencias();
  let h='<div class="grid-sem">';
  for(let i=0;i<7;i++){
    const d=new Date(l); d.setDate(d.getDate()+i);
    const f=iso(d), fer=feriadoDe(f), lista=ocs.filter(o=>o.fecha===f);
    h+='<div class="col-dia'+(fer&&filtros.areas.has('feriado')?' feriado':'')+'"><h4><span>'+DOW[i]+' '+d.getDate()+'</span>'+
      (fer?'<span class="fer-tag">feriado</span>':'<button class="plus" style="opacity:1" data-nuevofecha="'+f+'">＋</button>')+'</h4>';
    if(!lista.length) h+='<div style="color:var(--gris);font-size:12px;padding:4px 2px">—</div>';
    lista.forEach(o=>h+=chipEv(o,uni));
    h+='</div>';
  }
  return h+'</div>';
}

  });

  let der='<div class="card"><h3>Ocupación de salas</h3>';
  SALAS_FISICAS.forEach(s=>{
    const en=ocurrencias().filter(o=>o.fecha===f&&(o.ev.salas||[]).includes(s));

function valF(id){ const el=document.getElementById(id); return el?el.value.trim():''; }
function filtrarNomina(){
  const q=norm(valF('pBuscar')).replace(/^(el\s+)?equipo\s+de\s+/,'').trim();
  const lid=valF('pLider'), uni=valF('pUni'), pue=valF('pPuesto'), ver=valF('pVert'), soc=valF('pSoc');
  let base=DB.nomina;
  if(lid) base=base.filter(p=>(JER.equipo[lid]||[]).includes(p.l)||norm(p.j)===norm(lid));
  if(uni) base=base.filter(p=>norm(p.u).includes(norm(uni)));
  if(pue) base=base.filter(p=>norm(p.p).includes(norm(pue)));
  if(ver) base=base.filter(p=>norm(p.v).includes(norm(ver)));
  if(soc) base=base.filter(p=>norm(p.s).includes(norm(soc)));
  const equipos=q.length>=3?JER.lideres.filter(l=>norm(l.nombre).includes(q)&&l.total>0):[];
  const idsEq=new Set(equipos.flatMap(l=>(JER.equipo[l.nombre]||[]).concat(l.legajo?[l.legajo]:[])));
  const propios=new Set(equipos.map(l=>l.legajo).filter(Boolean));
  let lista=q?base.filter(p=>norm(p.n+' '+p.l+' '+p.p+' '+p.e+' '+p.u).includes(q)||idsEq.has(p.l)):base;
  if(propios.size) lista=[...lista].sort((a,b)=>(propios.has(b.l)?1:0)-(propios.has(a.l)?1:0));
  return {lista,equipos,q,propios};
}

const ENCABEZADOS=['apellido y nombre','nombre y apellido','apellido','nombre','comentario','comentarios','mail','e-mail','email','correo','legajo','sociedad','area','área','puesto','posicion','lider','líder','unidad','observaciones','total','participantes','asistentes'];
function normN(s){ return norm(s).replace(/[,.;:]/g,' ').replace(/\s+/g,' ').trim(); }
function tokensDe(p){ return norm(p.n).split(/\s+/).filter(Boolean); }
function candidatosPegados(txt){
  const out=[];
  txt.split(/\r?\n/).forEach(l=>{
    const cel=l.split(/\t|\||;/).map(x=>x.trim().replace(/^"|"$/g,'')).filter(Boolean);
    if(!cel.length) return;
    let c=cel[0];

    if(ENCABEZADOS.includes(normN(c))) return;
    out.push(c);

}
function buscarUna(txt){
  const n=normN(txt);
  if(!n) return {estado:'no'};
  if(n.includes('@')){ const p=DB.nomina.find(x=>norm(x.e)===n.replace(/\s/g,'')); return p?{estado:'ok',p}:{estado:'no'}; }
  if(/^\d{3,}$/.test(n)){ const p=DB.nomina.find(x=>norm(x.l)===n); return p?{estado:'ok',p}:{estado:'no'}; }
  const t=n.split(' ').filter(w=>w.length>1);
  if(!t.length) return {estado:'no'};
  let c=DB.nomina.filter(p=>{ const s=tokensDe(p); return s.length===t.length&&t.every(w=>s.includes(w)); });
  if(c.length===1) return {estado:'ok',p:c[0]};
  c=DB.nomina.filter(p=>{ const s=tokensDe(p); return t.every(w=>s.includes(w)); });
  if(c.length===1) return {estado:'ok',p:c[0]};
  if(c.length>1) return {estado:'varios',opciones:c.slice(0,8)};
  c=DB.nomina.filter(p=>{ const s=tokensDe(p); return t.every(w=>s.some(x=>x.startsWith(w)||w.startsWith(x))); });
  if(c.length===1) return {estado:'ok',p:c[0]};
  if(c.length>1&&c.length<=8) return {estado:'varios',opciones:c};
  return {estado:'no'};
}

/* =======================================================================
   LECTOR DE XLSX (sin librerías: zip + DecompressionStream)
   ======================================================================= */
async function inflar(bytes,metodo){
  if(metodo===0) return bytes;
  if(typeof DecompressionStream==='undefined') throw new Error('Este navegador no puede abrir .xlsx; usá Chrome o pegá los datos.');
  const s=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function leerZip(buf){
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);
  let eocd=-1;
  for(let i=buf.length-22;i>=0&&i>buf.length-66000;i--) if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  if(eocd<0) throw new Error('El archivo no parece un .xlsx válido');
  const total=dv.getUint16(eocd+10,true); let off=dv.getUint32(eocd+16,true);
  const salida={};
  for(let i=0;i<total;i++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const metodo=dv.getUint16(off+10,true), comp=dv.getUint32(off+20,true);
    const nl=dv.getUint16(off+28,true), el=dv.getUint16(off+30,true), cl=dv.getUint16(off+32,true);
    const lho=dv.getUint32(off+42,true);
    const nombre=new TextDecoder().decode(buf.subarray(off+46,off+46+nl));
    const lnl=dv.getUint16(lho+26,true), lel=dv.getUint16(lho+28,true);
    const ini=lho+30+lnl+lel;
    salida[nombre]={metodo,datos:buf.subarray(ini,ini+comp)};
    off+=46+nl+el+cl;
  }
  return salida;
}
async function leerXlsx(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  const z=await leerZip(buf);
  const dec=new TextDecoder();
  const txt=async n=>z[n]?dec.decode(await inflar(z[n].datos,z[n].metodo)):'';
  const shared=[];
  const ss=await txt('xl/sharedStrings.xml');
  if(ss){
    const doc=new DOMParser().parseFromString(ss,'application/xml');
    doc.querySelectorAll('si').forEach(si=>shared.push([...si.querySelectorAll('t')].map(t=>t.textContent).join('')));
  }
  const hoja=Object.keys(z).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
  if(!hoja) throw new Error('No encontré la hoja de datos');
  const doc=new DOMParser().parseFromString(await txt(hoja),'application/xml');
  const filas=[];
  doc.querySelectorAll('sheetData > row').forEach(row=>{
    const f=[]; let sig=0;
    row.querySelectorAll('c').forEach(c=>{
      const ref=(c.getAttribute('r')||'').replace(/\d+/g,'').toUpperCase();
      let col;
      if(ref){ col=0; for(const ch of ref) col=col*26+(ch.charCodeAt(0)-64); col=Math.max(0,col-1); }
      else col=sig;
      sig=col+1;
      const t=c.getAttribute('t'); let v='';
      if(t==='s') v=shared[+(c.querySelector('v')?.textContent||0)]||'';
      else if(t==='inlineStr') v=[...c.querySelectorAll('t')].map(x=>x.textContent).join('');
      else v=c.querySelector('v')?.textContent||'';
      f[col]=v;
    });
    filas.push(Array.from(f,x=>x===undefined?'':String(x).trim()));
  });
  return filas;
}
function filasANomina(filas){
  if(!filas||filas.length<2) return [];

  const idx=(...alts)=>cab.findIndex(c=>alts.some(a=>c.includes(a)));

        iV=idx('vetical','vertical'), iE=idx('mail','correo');
  const out=[];

/* =======================================================================
   EXCEL DE SALIDA (xlsx armado a mano, con formato)
   ======================================================================= */
const CRC=(()=>{ const t=new Uint32Array(256);
  for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[i]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(files){
  const enc=new TextEncoder(), locales=[], central=[]; let off=0;
  files.forEach(f=>{
    const nombre=enc.encode(f.name), datos=typeof f.data==='string'?enc.encode(f.data):f.data;
    const crc=crc32(datos), lh=new Uint8Array(30+nombre.length), dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0,true); dv.setUint16(8,0,true);
    dv.setUint16(10,0,true); dv.setUint16(12,0x2821,true); dv.setUint32(14,crc,true);
    dv.setUint32(18,datos.length,true); dv.setUint32(22,datos.length,true);
    dv.setUint16(26,nombre.length,true); dv.setUint16(28,0,true);
    lh.set(nombre,30);
    locales.push(lh,datos);
    const ch=new Uint8Array(46+nombre.length), dc=new DataView(ch.buffer);
    dc.setUint32(0,0x02014b50,true); dc.setUint16(4,20,true); dc.setUint16(6,20,true);
    dc.setUint16(10,0,true); dc.setUint16(12,0x2821,true); dc.setUint32(16,crc,true);
    dc.setUint32(20,datos.length,true); dc.setUint32(24,datos.length,true);
    dc.setUint16(28,nombre.length,true); dc.setUint32(42,off,true);
    ch.set(nombre,46);
    central.push(ch);
    off+=lh.length+datos.length;
  });
  const cdSize=central.reduce((a,c)=>a+c.length,0);
  const eocd=new Uint8Array(22), de=new DataView(eocd.buffer);
  de.setUint32(0,0x06054b50,true); de.setUint16(8,files.length,true); de.setUint16(10,files.length,true);
  de.setUint32(12,cdSize,true); de.setUint32(16,off,true);
  const total=[...locales,...central,eocd];
  const out=new Uint8Array(total.reduce((a,x)=>a+x.length,0));
  let p=0; total.forEach(x=>{ out.set(x,p); p+=x.length; });
  return out;
}
const xe=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
function colLetra(n){ let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-m-1)/26; } return s; }
function hojaXml(datos,anchos){
  const filas=datos.map((fila,r)=>'<row r="'+(r+1)+'">'+fila.map((cel,c)=>{
    const ref=colLetra(c)+(r+1);
    const st=r===0?1:(cel&&cel.s?cel.s:2);
    const val=cel&&typeof cel==='object'?cel.v:cel;
    if(typeof val==='number') return '<c r="'+ref+'" s="'+st+'"><v>'+val+'</v></c>';
    return '<c r="'+ref+'" s="'+st+'" t="inlineStr"><is><t xml:space="preserve">'+xe(val)+'</t></is></c>';
  }).join('')+'</row>').join('');
  const ref='A1:'+colLetra(datos[0].length-1)+datos.length;

function estiloArea(a){ return a==='talentos'?3:a==='marketing'?4:5; }
function descargarExcel(){
  const ocs=visibles();
  if(!ocs.length){ toast('No hay eventos con los filtros actuales'); return; }
  const cabE=['Mes','Fecha','Día','Desde','Hasta','Evento','Área','Tipo','Asistencia','Sala / lugar','Cargado por','Personas','Detalle','Notas'];
  const filasE=[cabE];
  ocs.forEach(o=>{
    const d=deIso(o.fecha), sa=estiloArea(o.ev.area);
    filasE.push([cap(MESES[d.getMonth()])+' '+d.getFullYear(), o.fecha, DOW[(d.getDay()+6)%7],
      o.todo?'Todo el día':(o.d||''), o.todo?'':(o.h||''), o.ev.titulo,
      {v:AREA_NOMBRE[o.ev.area],s:sa}, tipoTexto(o.ev.tipo), o.ev.obligatorio===false?'Opcional':'Obligatoria', lugarDe(o.ev), o.ev.responsable,
      {v:(o.ev.participantes||[]).length}, o.ev.detalle||'', o.ev.notas||'']);
  });
  const cabP=['Mes','Fecha','Evento','Área','Cargado por','Persona','Puesto','Unidad','Vertical','Sociedad','Líder'];
  const filasP=[cabP];
  ocs.forEach(o=>(o.ev.participantes||[]).forEach(id=>{
    const p=persona(id)||{n:id,p:'',u:'',v:'',s:'',j:''}, d=deIso(o.fecha);
    filasP.push([cap(MESES[d.getMonth()])+' '+d.getFullYear(), o.fecha, o.ev.titulo,
      {v:AREA_NOMBRE[o.ev.area],s:estiloArea(o.ev.area)}, o.ev.responsable, p.n, p.p, p.u, p.v, p.s, p.j]);
  }));
  const hojas=[{nombre:'Eventos',datos:filasE,anchos:[14,11,6,8,8,42,14,24,13,26,18,10,40,30]}];
  if(filasP.length>1) hojas.push({nombre:'Participantes',datos:filasP,anchos:[14,11,38,14,18,28,26,22,16,24,24]});
  const bytes=xlsx(hojas);
  const nombre='calendario-fyo'+(filtros.q?'-'+norm(filtros.q).replace(/\s+/g,'-'):'')+'.xlsx';
  bajar(nombre,bytes,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  toast('Excel descargado · '+ocs.length+' fechas');
}
function bajar(n,c,t){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([c],{type:t})); a.download=n; a.click(); URL.revokeObjectURL(a.href); }

function revisiones(){
  const out=[];
  ocurrencias().forEach(o=>{
    const d=deIso(o.fecha), dow=d.getDay(), fer=feriadoDe(o.fecha);
    if(dow===0||dow===6) out.push({o,motivo:dow===0?'cae domingo':'cae sábado'});
    else if(fer) out.push({o,motivo:'cae feriado'});
  });
  return out.sort((a,b)=>a.o.fecha.localeCompare(b.o.fecha));
}
function moverFecha(evId,fecha,dir){
  const ev=DB.eventos.find(e=>e.id===evId); if(!ev) return;
  const f=ev.fechas.find(x=>x.f===fecha); if(!f) return;
  const d=deIso(fecha);
  do{ d.setDate(d.getDate()+dir); }while(d.getDay()===0||d.getDay()===6||feriadoDe(iso(d)));
  f.f=iso(d); guardar(); render(); abrirConflictos(); toast('Movido al '+fechaLarga(f.f));
}

function cerrarTodo(){ document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('on')); }
document.querySelectorAll('.overlay').forEach(ov=>ov.addEventListener('mousedown',e=>{ if(e.target===ov) cerrarTodo(); }));
document.addEventListener('click', e=>{
  const t=e.target.closest('button,[data-nuevofecha],.lista-it,.agenda-it,[data-cerrar]');
  if(!t) return;
  if(t.hasAttribute('data-cerrar')||t.classList.contains('cerrar')){ cerrarTodo(); return; }
  if(t.dataset.ev){ verDetalle(t.dataset.ev); return; }
  if(t.dataset.dia){ cursor=deIso(t.dataset.dia); vista='dia'; sincro(); render(); return; }
  if(t.dataset.nuevofecha){ if(document.getElementById('ovEvento').classList.contains('on')) return; nuevoEvento(t.dataset.nuevofecha); return; }
  if(t.dataset.vista){ vista=t.dataset.vista; sincro(); render(); return; }
  if(t.classList.contains('chip-f')){ const a=t.dataset.area; filtros.areas.has(a)?filtros.areas.delete(a):filtros.areas.add(a); t.classList.toggle('on'); render(); return; }
  if(t.dataset.edit){ cerrarTodo(); editarEvento(t.dataset.edit); return; }
  if(t.dataset.verdia){ cursor=deIso(t.dataset.verdia); vista='dia'; sincro(); cerrarTodo(); render(); return; }
  if(t.dataset.solo){ sumar([t.dataset.solo]); return; }
  if(t.dataset.pick!==undefined){
    const i=+t.dataset.amb; sumar([t.dataset.pick]);
    pegAmb.splice(i,1); const c=document.getElementById('pResultado');
    pintarResultadoPegado(JSON.parse(c.dataset.enc||'[]').map(l=>persona(l)).filter(Boolean), JSON.parse(c.dataset.sin||'[]'));
    return;
  }
  if(t.dataset.ambNo!==undefined){
    pegAmb.splice(+t.dataset.ambNo,1); const c=document.getElementById('pResultado');
    pintarResultadoPegado(JSON.parse(c.dataset.enc||'[]').map(l=>persona(l)).filter(Boolean), JSON.parse(c.dataset.sin||'[]'));
    return;
  }
  if(t.dataset.mov){ moverFecha(t.dataset.mid,t.dataset.mf,+t.dataset.mov); return; }
  if(t.dataset.ob!==undefined){ leerForm(); borrador.obligatorio=t.dataset.ob==='1'; pintarForm(); return; }
  if(t.dataset.eqdir){ sumar(JER.directos[t.dataset.eqdir]||[]); return; }
  if(t.dataset.eqtot){ sumar(JER.equipo[t.dataset.eqtot]||[]); return; }
  if(t.dataset.quitar!==undefined){ leerForm(); borrador.fechas.splice(+t.dataset.quitar,1); pintarForm(); return; }
  if(t.dataset.quitarp!==undefined){ borrador.participantes=borrador.participantes.filter(p=>p!==t.dataset.quitarp); pintarPersonas(); pintarConflictosForm(); return; }
  if(t.dataset.t){ leerForm(); borrador.tipo=t.dataset.t; if(t.dataset.t==='institucional') borrador.area='interno'; else borrador.area=areaDeResponsable(borrador.responsable); pintarForm(); return; }
  if(t.dataset.r){ leerForm(); borrador.responsable=t.dataset.r; borrador.area=borrador.tipo==='institucional'?'interno':areaDeResponsable(t.dataset.r); pintarForm(); return; }
  if(t.dataset.m){ leerForm(); borrador.modalidad=t.dataset.m; if(t.dataset.m==='oficina'&&!borrador.salas.length) borrador.salas=['Sala B']; pintarForm(); return; }

  switch(t.id){
    case 'btnNuevo': nuevoEvento(); return;
    case 'prev': mover(-1); return;
    case 'next': mover(1); return;
    case 'hoy': cursor=new Date(); render(); return;
    case 'btnConf': abrirConflictos(); return;
    case 'btnNomina': abrirNomina(); return;
    case 'btnDatos': abrirDatos(); return;
    case 'evGuardar': guardarEvento(); return;
    case 'evBorrar': if(confirm('¿Borrar “'+borrador.titulo+'” y todas sus fechas?')){ DB.eventos=DB.eventos.filter(x=>x.id!==borrador.id); guardar(); cerrarTodo(); render(); toast('Borrado'); } return;
    case 'dtEditar': cerrarTodo(); editarEvento(detalleId); return;
    case 'dtBorrar': if(confirm('¿Borrar este evento?')){ DB.eventos=DB.eventos.filter(x=>x.id!==detalleId); guardar(); cerrarTodo(); render(); toast('Borrado'); } return;
    case 'dtDuplicar': { const ev=DB.eventos.find(x=>x.id===detalleId); borrador=JSON.parse(JSON.stringify(ev)); borrador.id=null; borrador.titulo=ev.titulo+' (copia)'; cerrarTodo(); abrirForm('Duplicar'); return; }
    case 'cambiarArea': { const o=['talentos','marketing','interno']; leerForm(); borrador.area=o[(o.indexOf(borrador.area)+1)%3]; pintarForm(); return; }
    case 'addFecha': { leerForm(); const u=borrador.fechas.at(-1)||{f:iso(cursor),d:'09:00',h:'11:00',todo:false}; const d=deIso(u.f); d.setDate(d.getDate()+7); borrador.fechas.push({f:iso(d),d:u.d,h:u.h,todo:u.todo}); pintarForm(); return; }
    case 'repSem': { leerForm(); const n=parseInt(prompt('¿Cuántos encuentros semanales en total? (contando el primero)','4'),10); if(!n||n<2) return; const b=borrador.fechas[0]; borrador.fechas=[b]; for(let i=1;i<n;i++){ const d=deIso(b.f); d.setDate(d.getDate()+7*i); borrador.fechas.push({f:iso(d),d:b.d,h:b.h,todo:b.todo}); } pintarForm(); return; }
    case 'pTodos': sumar([...document.querySelectorAll('.pChk')].map(c=>c.value)); return;
    case 'pCompania': if(confirm('¿Agregar a las '+DB.nomina.length+' personas de la compañía?')) sumar(DB.nomina.map(p=>p.l)); return;
    case 'pBuscarLista': buscarPegado(); return;

    case 'nomPegar': { const filas=document.getElementById('nomTexto').value.split(/\r?\n/).filter(l=>l.trim()).map(l=>{ const sep=l.includes('\t')?'\t':(l.split(';').length>l.split(',').length?';':','); return l.split(sep).map(x=>x.trim()); }); compararNomina(filasANomina(filas)); return; }
    case 'nomConfirmar': { DB.nomina=nominaNueva; DB.nominaFecha=new Date().toLocaleDateString('es-AR'); armarJerarquia(); guardar(); cerrarTodo(); render(); toast(DB.nomina.length+' personas actualizadas'); return; }
    case 'nomCancelar': document.getElementById('nomDiff').innerHTML=''; nominaNueva=null; return;
    case 'expXls': case 'dXls': descargarExcel(); return;
    case 'dExp': bajar('calendario-talentos-marketing.json', JSON.stringify(DB,null,1),'application/json'); return;
    case 'dImp': document.getElementById('dFile').click(); return;
    case 'dReset': if(confirm('Vuelve a los eventos originales del Excel y borra lo cargado después. ¿Seguir?')){ DB=semilla(); armarJerarquia(); guardar(); cerrarTodo(); render(); toast('Restaurado'); } return;
  }
});
document.addEventListener('change', async e=>{
  const el=e.target;
  if(el.id==='fSala'){ filtros.sala=el.value; render(); return; }
  if(el.id==='fResp'){ filtros.resp=el.value; render(); return; }
  if(el.id==='fPersona'){ filtros.persona=el.value; render(); return; }
  if(el.classList.contains('fTodo')){ leerForm(); pintarForm(); return; }
  if(el.classList.contains('fFecha')||el.classList.contains('fD')||el.classList.contains('fH')||el.classList.contains('cSala')){
    leerForm(); if(el.classList.contains('cSala')) el.closest('.chk').classList.toggle('on',el.checked);
    pintarConflictosForm(); return;
  }
  if(el.classList.contains('pChk')){
    if(el.checked){ if(!borrador.participantes.includes(el.value)) borrador.participantes.push(el.value); }
    else borrador.participantes=borrador.participantes.filter(p=>p!==el.value);
    pintarPersonas(); pintarConflictosForm(); return;
  }
  if(['pLider','pUni','pPuesto','pVert','pSoc'].includes(el.id)){ pintarPersonas(); return; }
  if(el.id==='nomFile'){
    const f=el.files[0]; if(!f) return;
    try{
      let filas;
      if(/\.xlsx$/i.test(f.name)) filas=await leerXlsx(f);
      else { const txt=await f.text(); filas=txt.split(/\r?\n/).filter(l=>l.trim()).map(l=>{ const sep=l.includes('\t')?'\t':(l.split(';').length>l.split(',').length?';':','); return l.split(sep).map(x=>x.trim().replace(/^"|"$/g,'')); }); }
      compararNomina(filasANomina(filas));
    }catch(err){ console.error(err); toast('No pude leer el archivo: '+err.message); }
    return;
  }
  if(el.id==='dFile'){
    const f=el.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.eventos) throw 0; DB=d; DB.nomina ||= NOMINA_BASE.slice(); armarJerarquia(); guardar(); cerrarTodo(); render(); toast('Importado'); }catch(err){ toast('El archivo no tiene el formato esperado'); } };
    r.readAsText(f); return;
  }
});

function mover(d){
  if(vista==='mes'||vista==='lista') cursor.setMonth(cursor.getMonth()+d);
  else if(vista==='semana') cursor.setDate(cursor.getDate()+7*d);
  else cursor.setDate(cursor.getDate()+d);
  cursor=new Date(cursor); render();
}
function sincro(){ document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.vista===vista)); }
function refrescarFiltros(){
  const p=document.getElementById('fPersona');
  const usados=[...new Set(DB.eventos.flatMap(e=>e.participantes||[]))];
  p.innerHTML='<option value="">Todas las personas</option>'+usados.map(id=>'<option value="'+esc(id)+'">'+esc(nombreDe(id))+'</option>').join('');
  p.value=filtros.persona;
}
function iniciar(){
  armarJerarquia();
  document.getElementById('fSala').innerHTML='<option value="">Todas las salas</option>'+SALAS.map(s=>'<option>'+s+'</option>').join('');
  document.getElementById('fResp').innerHTML='<option value="">Quién cargó</option>'+RESPONSABLES.map(r=>'<option>'+r.n+'</option>').join('');
  refrescarFiltros();
  const fechas=DB.eventos.flatMap(e=>e.fechas.map(f=>f.f)).sort(), hoy=iso(new Date());
  if(fechas.length&&!fechas.some(f=>f.slice(0,7)===hoy.slice(0,7))){
    const prox=fechas.find(f=>f>=hoy)||fechas.at(-1);
    if(prox) cursor=deIso(prox);
  }
  render();
}
iniciar();
</script>
